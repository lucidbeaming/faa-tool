<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="bbt-title">
	<title id="bbt-title">Big Bird Talk emblem: a gold bird flying over mountains and a river</title>
	<defs>
		<clipPath id="bbt-disc">
			<circle cx="200" cy="200" r="110" />
		</clipPath>
		<path id="bbt-top" d="M 65 200 A 135 135 0 0 1 335 200" />
		<path id="bbt-bottom" d="M 43 200 A 157 157 0 0 0 357 200" />
		<path
			id="bbt-star"
			d="M0,-9 L2.6,-3.1 L8.6,-2.8 L4,1.2 L5.3,7.3 L0,4 L-5.3,7.3 L-4,1.2 L-8.6,-2.8 L-2.6,-3.1 Z"
		/>
	</defs>

	<!-- Rings -->
	<circle cx="200" cy="200" r="192" fill="#a87b00" />
	<circle cx="200" cy="200" r="185" fill="#d4b76a" />
	<circle cx="200" cy="200" r="178" fill="#091f62" />
	<circle cx="200" cy="200" r="118" fill="#ffffff" />
	<circle cx="200" cy="200" r="110" fill="#0a6826" />

	<!-- Ring lettering -->
	<g
		fill="#ffffff"
		font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
		font-size="36"
		font-weight="700"
		letter-spacing="5"
		text-anchor="middle"
	>
		<text><textPath href="#bbt-top" startOffset="50%">BIG BIRD</textPath></text>
		<text><textPath href="#bbt-bottom" startOffset="50%">TALK</textPath></text>
	</g>
	<use href="#bbt-star" x="52" y="200" fill="#ffffff" />
	<use href="#bbt-star" x="348" y="200" fill="#ffffff" />

	<!-- Disc scene -->
	<g clip-path="url(#bbt-disc)">
		<!-- rock-scratch globe lines -->
		<g fill="none" stroke="#d4b76a" stroke-width="2" opacity="0.35">
			<ellipse cx="200" cy="200" rx="55" ry="110" />
			<ellipse cx="200" cy="200" rx="95" ry="110" />
			<path d="M90 160 Q200 140 310 160 M90 240 Q200 220 310 240" />
		</g>

		<!-- sun -->
		<g fill="#d4b76a" stroke="#d4b76a" stroke-width="3" stroke-linecap="round">
			<circle cx="140" cy="132" r="13" />
			<path d="M140 110v-8 M140 154v8 M118 132h-8 M162 132h8 M124 116l-6-6 M156 148l6 6 M156 116l6-6 M124 148l-6 6" />
		</g>

		<!-- mountains -->
		<path
			d="M80 320 L80 262 L122 222 L146 246 L184 204 L222 250 L246 228 L320 290 L320 320 Z"
			fill="#a87b00"
		/>
		<path d="M184 204 L172 218 L180 214 L186 222 L194 214 Z M122 222 L114 230 L124 228 L130 232 Z" fill="#ffffff" />

		<!-- river -->
		<path
			d="M150 320 C160 296 196 296 190 280 C184 266 214 262 226 254"
			fill="none"
			stroke="#ffffff"
			stroke-width="6"
			stroke-linecap="round"
		/>

		<!-- big bird -->
		<g fill="#d4b76a" stroke="#a87b00" stroke-width="2" stroke-linejoin="round">
			<path d="M196 178 L150 150 L160 168 L130 160 L148 180 L118 180 L150 196 L130 204 L196 198 Z" />
			<path d="M212 178 L258 150 L248 168 L278 160 L260 180 L290 180 L258 196 L278 204 L212 198 Z" />
			<ellipse cx="204" cy="196" rx="15" ry="26" />
			<path d="M196 218 L204 240 L212 218 Z" />
			<circle cx="204" cy="164" r="11" />
			<path d="M213 160 L230 165 L213 169 Z" fill="#ff6600" />
		</g>
		<circle cx="207" cy="162" r="2.2" fill="#091f62" />
	</g>
</svg>
